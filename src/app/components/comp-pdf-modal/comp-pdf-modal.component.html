@if (isOpen) {
  <div class="pdf-backdrop" (click)="close.emit()"></div>

  <div class="pdf-modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="pdf-confidential-overlay"></div>
    <button class="pdf-close" (click)="close.emit()">✕</button>
    <div class="pdf-content">
      <comp-pdf-result [conventionData]="conventionData"></comp-pdf-result>
    </div>
    
    @if (showValidationButton) {
      <div class="pdf-validation-bar">
        <button class="pdf-validate-button" (click)="validate.emit()">
          <i class="fa-solid fa-check-circle mr-2"></i>
          Valider la saisie
        </button>
      </div>
    }
  </div>
}
