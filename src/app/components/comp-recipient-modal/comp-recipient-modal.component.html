@if (isOpen) {
  <div class="recipient-backdrop" (click)="onClose()"></div>

  <div class="recipient-modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="recipient-header">
      <h2 class="recipient-title">Destinataire de la convention</h2>
      <button class="recipient-close" (click)="onClose()">✕</button>
    </div>

    <div class="recipient-body">
      <p class="recipient-description">
        Veuillez saisir les informations du destinataire à qui envoyer la convention PDF par email.
      </p>

      <form [formGroup]="recipientForm" (ngSubmit)="onSubmit()" class="recipient-form">
        <div class="form-grid">
          <comp-input
            formControlName="nom"
            label="Nom"
            placeholder="Nom du destinataire"
            [required]="true"
          ></comp-input>

          <comp-input
            formControlName="prenom"
            label="Prénom"
            placeholder="Prénom du destinataire"
            [required]="true"
          ></comp-input>

          <comp-input
            formControlName="fonction"
            label="Fonction"
            placeholder="Fonction du destinataire"
            [required]="true"
          ></comp-input>

          <comp-input
            formControlName="email"
            label="Email"
            placeholder="destinataire@exemple.com"
            type="email"
            [required]="true"
          ></comp-input>
        </div>

        <div class="recipient-actions">
          <comp-button
            label="Annuler"
            variant="neutral"
            type="button"
            (click)="onClose()"
          ></comp-button>
          <comp-button
            label="Valider et envoyer"
            variant="primary"
            type="submit"
          ></comp-button>
        </div>
      </form>
    </div>
  </div>
}
