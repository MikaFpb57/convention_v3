
<div
  class="pdf-page relative text-gray-900 shadow-xl mx-auto overflow-hidden"
  [style]="getFullStyle()"
>
  <div
    [style.fontSize.px]="baseFontSize * zoom"
    [style.padding.px]="(isImagePage ? padding / 4 * zoom : padding * zoom)"
    style="height: 100%; box-sizing: border-box; overflow: hidden;"
  >
    @if(!isImagePage && !hasBackground){
      <table class="page_header">
        <tr>
          <td style="width: 30%; text-align: left;">
            <img src="./assets/img/fpb_logo.png" style="width:100%; height:auto;" />
          </td>
          <td style="width: 30%; text-align: left;"></td>
          <td style="width: 40%; text-align: right; font-size: 1.5em; color:#696969; padding-right:3mm;">
            {{title}}
          </td>
        </tr>
      </table>
    }

    <ng-content></ng-content>
  </div>
</div>
