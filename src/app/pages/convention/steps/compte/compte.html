<div class="relative">
    <!-- Spinner Overlay -->
    @if (isLoading()) {
    <comp-loader></comp-loader>
    }

    <!-- Error Alert -->
    @if (errorMessage()) {
    <comp-alert-error [message]="errorMessage()"></comp-alert-error>
    }

    <form [formGroup]="compteForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <comp-h1-gd textGradient="Informations" textNormal="sur la société"></comp-h1-gd>

        <!-- Siret / TVA Intra -->
        <div class="grid gap-4 mb-3 md:grid-cols-2">
            <comp-input groupClass="" formControlName="siret" label="Numéro Siret" [required]="true" id="siret"
                name="siret" placeholder="12345678901234" extraClass="w-full"
                [errorMessage]="getControl('siret').touched && getControl('siret').invalid ? 'Siret requis.' : null"
                (blur)="onSiretBlur()">
            </comp-input>
            <comp-input formControlName="tvaIntra" label="Numéro de TVA Intracommunautaire" [required]="true"
                id="tvaIntra" name="tvaIntra" extraClass="w-full">
            </comp-input>
        </div>

        <!-- Nom Société -->
        <comp-input groupClass="mb-3" formControlName="nomSociete" label="Nom de la société" [required]="true"
            id="nomSociete" name="nomSociete" extraClass="w-full"
            [errorMessage]="getControl('nomSociete').touched && getControl('nomSociete').invalid ? 'Nom requis.' : null">
        </comp-input>

        <!-- Adresse -->
        <comp-input groupClass="mb-3" formControlName="adresse" label="Adresse" [required]="true" id="adresse"
            name="adresse" extraClass="w-full"
            [errorMessage]="getControl('adresse').touched && getControl('adresse').invalid ? 'Adresse requis.' : null">
        </comp-input>

        <!-- CP / Ville -->
        <div class="grid gap-4 mb-3 md:grid-cols-2">
            <comp-input formControlName="codePostal" label="Code postal" [required]="true" id="codePostal"
                name="codePostal" extraClass="w-full"
                [errorMessage]="getControl('codePostal').touched && getControl('codePostal').invalid ? 'Nom requis.' : null">
            </comp-input>
            <comp-input formControlName="ville" label="Ville" [required]="true" id="ville" name="ville"
                extraClass="w-full"
                [errorMessage]="getControl('ville').touched && getControl('ville').invalid ? 'Ville requise.' : null">
            </comp-input>
        </div>

        <!-- Code NAF / Activité -->
        <div class="grid gap-4 mb-3 md:grid-cols-2">
            <comp-input formControlName="codeNaf" label="Code NAF" id="codeNaf" name="codeNaf" extraClass="w-full">
            </comp-input>
            <comp-input formControlName="activitePrincipale" label="Activité principale" id="activitePrincipale"
                name="activitePrincipale" extraClass="w-full">
            </comp-input>
        </div>

        <!-- Rayon / Filiales -->
        <div class="grid gap-4 mb-3 md:grid-cols-2">
            <div>
                <label for="rayonAction" class="block text-sm font-medium text-heading mb-1">Rayon d'action</label>
                <select formControlName="rayonAction" id="rayonAction" name="rayonAction"
                    class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-md focus:ring-brand focus:border-brand block w-full p-2 shadow-xs h-9">
                    <option disabled selected>-- Rayon d'action --</option>
                    @for (option of rayonActionOptions; track option.value) {
                    <option [value]="option.value">{{ option.label }}</option>
                    }
                </select>
            </div>
            <comp-input formControlName="filiales" label="Filiales" id="filiales" name="filiales" extraClass="w-full">
            </comp-input>
        </div>

        <div class="pt-6 border-t border-gray-200 dark:border-gray-700">
            <h2 class="text-sm font-semibold text-gray-900 dark:text-white mb-4 uppercase tracking-wider">Logo de la
                société</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                <!-- Left: File Input -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Importer un logo</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="dropzone-file"
                            class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600 transition-all duration-300">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-500 mb-2"></i>
                                <p class="mb-2 text-sm text-gray-500 dark:text-gray-400 font-bold">Cliquer pour charger
                                </p>
                                <p class="text-xs text-gray-500 dark:text-gray-400">PNG, JPG ou SVG (MAX. 800x400px)</p>
                            </div>
                            <input id="dropzone-file" type="file" class="hidden" accept="image/*"
                                (change)="onLogoChange($event)" />
                        </label>
                    </div>
                </div>

                <!-- Right: Preview -->
                <div class="h-full flex flex-col">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Aperçu du
                        logo</label>
                    <div
                        class="flex-grow flex items-center justify-center p-4 border-2 border-gray-200 border-solid rounded-lg bg-white dark:bg-gray-800 h-32 relative group">
                        @if (compteForm.get('logo')?.value) {
                        <img [src]="compteForm.get('logo')?.value" class="max-h-full max-w-full object-contain"
                            alt="Logo preview">
                        <button type="button" (click)="removeLogo()"
                            class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                        } @else {
                        <div class="text-center text-gray-400">
                            <i class="fa-solid fa-image text-3xl mb-1"></i>
                            <p class="text-xs uppercase font-bold tracking-widest">Aucun logo</p>
                        </div>
                        }
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-end mt-4 gap-2">
            <div class="flex gap-2">
                <comp-button label="Effacer" variant="danger" type="button" (click)="onClear()">
                </comp-button>
            </div>
        </div>
    </form>
</div>
