<div class="p-4 sm:ml-64 mt-14">
    <div class="p-4 border-1 border-default border-dashed rounded-base mb-6">
        <!-- Stepper Header -->
        <ol class="flex items-center w-full mb-4 sm:mb-6">
            @for (step of steps; track step.path; let last = $last; let i = $index) {
            <li class="flex w-full items-center"
                [ngClass]="{'after:content-[\'\'] after:w-full after:h-1 after:border-b after:border-gray-100 after:border-4 after:inline-block dark:after:border-gray-700': !last}">

                <a [routerLink]="[step.path]" routerLinkActive #rla="routerLinkActive"
                    class="flex items-center justify-center w-10 h-10 rounded-full shrink-0 ring-0 ring-white dark:ring-gray-900 sm:ring-8"
                    [ngClass]="rla.isActive ? 'bg-blue-100 dark:bg-blue-800' : 'bg-gray-100 dark:bg-gray-700'">
                    <i [class]="step.icon"
                        [ngClass]="rla.isActive ? 'text-blue-600 dark:text-blue-300' : 'text-gray-500 dark:text-gray-100'"></i>
                </a>
            </li>
            }
        </ol>

        <!-- Content Area -->
        <div
            class="p-3 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700 text-sm">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
